/* cząsteczki: deszcz, mgła, iskry — jeden canvas, DPR ≤ 2 */
class Particles {
  constructor(canvas, mode, night) { this.c = canvas; this.g = canvas.getContext('2d'); this.mode = mode; this.night = night; this.ps = []; this.bursts = []; this.run = true; this.last = 0; this.resize(); this.init(); this.tick = this.tick.bind(this); requestAnimationFrame(this.tick); }
  resize() { const dpr = Math.min(2, window.devicePixelRatio || 1), rect = this.c.getBoundingClientRect(); this.w = Math.max(1, rect.width); this.h = Math.max(1, rect.height); this.c.width = this.w * dpr; this.c.height = this.h * dpr; this.g.setTransform(dpr, 0, 0, dpr, 0, 0); }
  init() { const n = this.mode === 'rain' ? 64 : this.mode === 'mist' ? 11 : 0; for (let i = 0; i < n; i++) this.ps.push(this.spawn(true)); }
  spawn(any) {
    if (this.mode === 'rain') return { x: Math.random() * this.w * 1.2, y: any ? Math.random() * this.h : -12, v: 240 + Math.random() * 160, l: 8 + Math.random() * 10, a: 0.12 + Math.random() * 0.18 };
    return { x: Math.random() * this.w, y: this.h * (0.4 + Math.random() * 0.55), r: 40 + Math.random() * 70, v: 5 + Math.random() * 9, a: (this.night ? 0.07 : 0.05) + Math.random() * 0.04, d: Math.random() < 0.5 ? 1 : -1 };
  }
  burst(x, y, n, color) { for (let i = 0; i < n; i++) this.bursts.push({ x, y, vx: (Math.random() - 0.5) * 240, vy: -60 - Math.random() * 200, life: 0.4 + Math.random() * 0.5, color }); }
  stop() { this.run = false; }
  tick(t) {
    if (!this.run) return;
    const dt = Math.min(0.05, this.last ? (t - this.last) / 1000 : 0.016); this.last = t; const g = this.g;
    g.clearRect(0, 0, this.w, this.h);
    if (this.mode === 'rain') { g.strokeStyle = '#d8c69c'; g.lineWidth = 1; for (const p of this.ps) { p.y += p.v * dt; p.x -= p.v * 0.14 * dt; if (p.y > this.h) Object.assign(p, this.spawn(false)); g.globalAlpha = p.a; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x + p.l * 0.14, p.y - p.l); g.stroke(); } }
    else if (this.mode === 'mist') { for (const p of this.ps) { p.x += p.v * p.d * dt; if (p.x < -p.r) p.x = this.w + p.r; if (p.x > this.w + p.r) p.x = -p.r; const gr = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r); gr.addColorStop(0, `rgba(140,160,150,${p.a})`); gr.addColorStop(1, 'rgba(140,160,150,0)'); g.globalAlpha = 1; g.fillStyle = gr; g.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2); } }
    for (let i = this.bursts.length - 1; i >= 0; i--) { const b = this.bursts[i]; b.life -= dt; if (b.life <= 0) { this.bursts.splice(i, 1); continue; } b.vy += 420 * dt; b.x += b.vx * dt; b.y += b.vy * dt; g.globalAlpha = Math.min(1, b.life * 2); g.fillStyle = b.color; g.fillRect(b.x, b.y, 2.2, 2.2); }
    g.globalAlpha = 1;
    requestAnimationFrame(this.tick);
  }
}

/* mapa wyprawy: stara mapa w SVG — kreślony szlak, mgła, ciepłe światło */
function mapSVG(S) {
  const exp = S.exp, map = exp.map, r = makeRng(map.seed), region = REGIONS[exp.regionId];
  const next = nextNodes(S).map((n) => n.id);
  let s = `<svg viewBox="0 0 ${MAP.W} ${MAP.H}" preserveAspectRatio="xMidYMid meet"><defs>
<radialGradient id="glow"><stop offset="0" stop-color="#e0a441" stop-opacity=".42"/><stop offset="1" stop-color="#e0a441" stop-opacity="0"/></radialGradient>
<radialGradient id="fog"><stop offset="0" stop-color="#14110d" stop-opacity=".96"/><stop offset=".55" stop-color="#14110d" stop-opacity=".85"/><stop offset="1" stop-color="#14110d" stop-opacity="0"/></radialGradient>
<filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter></defs>`;
  for (let i = 0; i < 30; i++) s += DECOR[r.pick(region.decor)](r.int(12, MAP.W - 12), r.int(24, MAP.H - 16));
  for (const [a, b] of map.edges) {
    const A = map.nodes[a], B = map.nodes[b];
    const mx = (A.x + B.x) / 2 + r.int(-16, 16), my = (A.y + B.y) / 2 + r.int(-8, 8);
    const lit = A.visited && B.visited, known = A.visited || nodeKnown(S, B);
    s += `<path d="M${A.x} ${A.y} Q${mx} ${my} ${B.x} ${B.y}" fill="none" stroke="${lit ? '#e0a441' : '#d8c69c'}" stroke-opacity="${lit ? 0.85 : known ? 0.5 : 0.22}" stroke-width="${lit ? 1.8 : 1.2}" ${lit ? '' : 'stroke-dasharray="2 5"'} stroke-linecap="round"/>`;
  }
  for (const n of map.nodes) if (!nodeKnown(S, n)) s += `<ellipse class="fogblob" cx="${n.x}" cy="${n.y}" rx="${r.int(48, 64)}" ry="${r.int(26, 36)}" fill="url(#fog)" filter="url(#blur)"/>`;
  for (const n of map.nodes) {
    const known = nodeKnown(S, n), isCur = n.id === exp.cur, reach = next.includes(n.id);
    const col = isCur ? '#e0a441' : known ? '#d8c69c' : '#6a5e48';
    s += `<g class="node${isCur ? ' cur' : ''}" ${reach ? `data-act="go" data-arg="${n.id}"` : ''}>`;
    if (n.visited) s += `<circle cx="${n.x}" cy="${n.y}" r="36" fill="url(#glow)"/>`;
    if (reach) s += `<circle class="ring" cx="${n.x}" cy="${n.y}" r="25"/>`;
    s += `<g class="core"><circle cx="${n.x}" cy="${n.y}" r="17" fill="#241d15" stroke="${col}" stroke-width="${isCur ? 2 : 1.4}" ${known ? '' : 'stroke-dasharray="2 3"'}/>`;
    s += `<g transform="translate(${n.x - 11} ${n.y - 11}) scale(0.92)" fill="none" stroke="${col}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${known ? ICONS[KINDS[n.kind].icon] : ICONS.unknown}</g></g>`;
    if (reach) s += `<circle cx="${n.x}" cy="${n.y}" r="30" fill="#000" fill-opacity="0.001"/>`;
    if (reach || isCur) s += `<text x="${n.x}" y="${n.y + 34}" text-anchor="middle" font-size="9.5" fill="#d8c69c" fill-opacity=".85" letter-spacing="1.6" style="font-family:var(--serif)">${esc(KINDS[n.kind].name.toUpperCase())}</text>`;
    s += '</g>';
  }
  s += `<text x="14" y="22" font-size="11" fill="#d8c69c" fill-opacity=".7" letter-spacing="3" style="font-family:var(--serif)">${esc(region.name.toUpperCase())}</text>`;
  s += compass(MAP.W - 30, 34);
  return s + '</svg>';
}

/* ============================================================
   5. EKRANY — HTML składany ze stanu; zdarzenia przez data-act
   ============================================================ */
const UI = { sheet: null, confirm: null, arch: null, name: null, contract: 0, party: [], resume: null };
const M = ['moneta', 'monety', 'monet'];
const SCREENS = {};
function btn(act, arg, label, cost, cls = '', disabled = false, pre = '') { return `<button class="btn ${cls}" data-act="${act}" data-arg="${esc(arg == null ? '' : arg)}"${disabled ? ' disabled' : ''}>${pre}<span class="lbl">${label}</span>${cost ? `<span class="cost">${esc(cost)}</span>` : ''}</button>`; }
const rule = () => `<div class="rule"><svg viewBox="0 0 14 14"><path d="M7 1 L13 7 L7 13 L1 7 Z"/></svg></div>`;
const section = (title, inner) => `<div class="section"><h2 class="h">${title}</h2>${inner}</div>${rule()}`;
function bars(u) { return `<div class="bars"><div class="bar"><i style="width:${Math.round((100 * u.hp) / u.maxHp)}%"></i></div><div class="bar mp"><i style="width:${u.maxMp ? Math.round((100 * u.mp) / u.maxMp) : 0}%"></i></div></div><div class="stat"><span>${u.hp}/${u.maxHp} zdr.</span><span>${u.mp}/${u.maxMp} woli</span></div>`; }
const fxLines = (fx, bad) => (fx && fx.length ? `<div class="fx-line${bad ? ' bad' : ''}">${fx.map(esc).join(' · ')}</div>` : '');
function statusTags(u) { const t = []; if (u.status) { if (u.status.stun) t.push('<span class="tag st">oszołomienie</span>'); if (u.status.pochwycony) t.push('<span class="tag bad">pochwycony</span>'); if (u.status.odsloniety) t.push('<span class="tag st">odsłonięty</span>'); } return t.join(''); }
function unitCard(u, cls) { return `<div class="punit ${cls || ''}${u.hp <= 0 ? ' dead' : ''}" data-uid="${u.uid}"><div class="row">${emblem(u.emblem, 'sm' + (u.hp <= 0 ? ' dead' : ''))}<div class="grow"><div class="name">${esc(u.short)}</div></div></div>${bars(u)}<div>${statusTags(u)}</div></div>`; }
function invHTML(items) { const ids = Object.keys(items).filter((k) => items[k] > 0); return ids.length ? `<div class="inv">${ids.map((k) => `<span class="item">${esc(ITEMS[k].name)} <b>×${items[k]}</b></span>`).join('')}</div>` : `<div class="empty">Pusta sakwa.</div>`; }
const favorWord = (f) => (f >= 2 ? 'łaskawość' : f >= 0 ? 'obojętność' : 'gniew');

/* ---------- tytuł ---------- */
SCREENS.title = (S) => `<div class="screen"><div class="scroll pad" style="display:flex;flex-direction:column"><div class="grow"></div>
<h1 class="title">Odmęt</h1><div class="sub">kroniki wypraw za mury</div>${rule()}
<p class="prose center small muted" style="padding:0 8px">Portowe miasto rządzone przez gildie. Za murami — bagna, ruiny, wieże i wszystko, co Cech kazał tam odesłać. Bogowie odpowiadają na modlitwy. To nie zawsze dobra wiadomość.</p>
${S.city.chronicle.length ? `<p class="center small muted">W Kronice: ${S.city.chronicle.length} ${pl(S.city.chronicle.length, ['wpis', 'wpisy', 'wpisów'])}. Miasto pamięta.</p>` : ''}
<div class="grow"></div></div>
<div class="actions">${UI.resume ? btn('continue', '', 'Kontynuuj', S.hero ? S.hero.short : '', 'primary') : ''}${btn('new', '', 'Nowa gra', '', UI.resume ? 'ghost' : 'primary')}</div></div>`;

/* ---------- nowy bohater ---------- */
SCREENS.create = (S) => {
  if (!UI.name) UI.name = genName(RNG);
  const c = S.city;
  return `<div class="screen"><div class="scroll pad"><h2 class="h">Nowy bohater</h2>
<p class="prose small muted">${c.heroes ? `Odmęt ma za sobą ${c.expeditions} ${pl(c.expeditions, ['wyprawę', 'wyprawy', 'wypraw'])} i ${c.chronicle.length} ${pl(c.chronicle.length, ['wpis', 'wpisy', 'wpisów'])} w Kronice. Ktoś musi iść następny.` : 'Cech Wagi szuka kogoś, kto pójdzie za mury i wróci z czymś, co da się zważyć. Nie pyta o powody. Powody nic nie ważą.'}</p>
<div class="card"><div class="row"><div class="grow"><div class="place" style="text-align:left">Imię</div><div class="name" style="font-size:22px">${esc(UI.name.name)}</div></div><button class="btn ghost sm" style="width:auto;margin:0" data-act="reroll"><span class="lbl">Inne</span></button></div></div>
${Object.values(ARCHETYPES).map((a) => `<div class="card ${UI.arch === a.id ? 'sel' : ''}" data-act="pickArch" data-arg="${a.id}"><div class="row">${emblem(a.emblem, 'lg')}<div class="grow"><div class="name">${esc(a.name)}</div><div class="small muted">${esc(a.desc)}</div></div></div><div class="stat" style="margin-top:8px"><span>zdrowie ${a.hp}</span><span>wola ${a.mp}</span><span>cios ${a.atk[0]}–${a.atk[1]}</span></div><div class="small" style="margin-top:4px"><span class="gold">${esc(a.ability.name)}</span> <span class="muted">— ${esc(a.ability.desc)} (${a.ability.mp} woli)</span></div></div>`).join('')}
</div><div class="actions">${btn('create', '', 'Do Odmętu', UI.arch ? '' : 'wybierz, kim jesteś', 'primary', !UI.arch)}</div></div>`;
};

/* ---------- miasto ---------- */
SCREENS.city = (S) => {
  const c = S.city, h = S.hero; if (!c.contracts) c.contracts = genContracts(c);
  const gid = 'cech_wagi', G = GUILDS[gid], ti = tierIndex(c, gid), nt = nextTier(c, gid), tier = G.tiers[ti];
  const repPct = nt ? Math.round((100 * (c.rep[gid] - tier.min)) / (nt.min - tier.min)) : 100;
  const comps = Object.keys(c.companions).filter((id) => c.companions[id].alive);
  UI.party = UI.party.filter((id) => comps.includes(id));
  if (UI.contract >= c.contracts.length) UI.contract = 0;
  const contract = c.contracts[UI.contract];
  const hero = `<div class="card"><div class="row">${emblem(h.emblem, 'lg')}<div class="grow"><div class="name">${esc(h.full)}</div><div class="small muted">${esc(ARCHETYPES[h.archId].name)} · ${esc(abilityOf(h).name)}</div>${bars(h)}</div></div><div style="margin-top:8px">${invHTML(h.items)}</div></div>`;
  const guild = `<div class="card"><div class="kv"><span>Ranga</span><span class="gold">${esc(tier.name)}</span></div><div class="kv"><span>Reputacja</span><span>${c.rep[gid]}${nt ? ` / ${nt.min} (${esc(nt.name)})` : ''}</span></div><div class="bar rep" style="margin:6px 0 4px"><i style="width:${repPct}%"></i></div><div class="small muted">${esc(G.desc)}</div></div>
<div class="place" style="margin:8px 0 6px">Kontrakty</div>
${c.contracts.map((k, i) => `<div class="card ${i === UI.contract ? 'sel' : ''}" data-act="city.contract" data-arg="${i}"><div class="name">${esc(k.name)}</div><div class="small muted">${esc(k.desc)}</div><div class="stat" style="margin-top:4px"><span>zapłata ${k.reward.gold} ${pl(k.reward.gold, M)}</span><span>reputacja +${k.reward.rep}</span></div></div>`).join('')}
<div class="place" style="margin:8px 0 6px">Przywileje</div>
${Object.values(UPGRADES).map((u) => { const own = c.upgrades.includes(u.id), locked = ti < u.tier; return `<div class="card ${own ? 'dim' : ''}"><div class="row"><div class="grow"><div class="name">${esc(u.name)}</div><div class="small muted">${esc(u.desc)}</div></div></div>${own ? '<div class="small gold" style="margin-top:6px">w posiadaniu</div>' : locked ? `<div class="small muted" style="margin-top:6px">od rangi: ${esc(G.tiers[u.tier].name)}</div>` : btn('city.buy', u.id, 'Kup', `${u.cost} ${pl(u.cost, M)} ze skarbca`, 'sm', c.gold < u.cost)}</div>`; }).join('')}`;
  const tavern = comps.length ? comps.map((id) => { const k = COMPANIONS[id], inP = UI.party.includes(id); return `<div class="card ${inP ? 'sel' : ''}" data-act="city.comp" data-arg="${id}"><div class="row">${emblem(k.emblem, 'lg')}<div class="grow"><div class="name">${esc(k.name)}</div><div class="small muted">${esc(k.tavern)}</div></div></div><div class="small" style="margin-top:6px"><span class="gold">${esc(k.ability.name)}</span> <span class="muted">— ${esc(k.ability.desc)}</span></div><div class="stat" style="margin-top:6px"><span>zdrowie ${companionUnit(id, c).maxHp}</span><span>${c.companions[id].scars ? `${c.companions[id].scars} ${pl(c.companions[id].scars, ['blizna', 'blizny', 'blizn'])}` : 'bez blizn'}</span></div><div class="small ${inP ? 'gold' : 'muted'}" style="margin-top:6px">${inP ? '◆ idzie z tobą' : 'dotknij, żeby zabrać'}</div></div>`; }).join('') : `<div class="empty">Nikt tu na ciebie nie czeka. Ludzie z Bagien trafiają do Tawerny dopiero wtedy, gdy ktoś jest im coś winien.</div>`;
  const gods = `<div class="card">${Object.values(GODS).map((g) => `<div class="kv"><span>${esc(g.name)}</span><span class="${c.favor[g.id] < 0 ? 'blood' : c.favor[g.id] >= 2 ? 'gold' : 'muted'}">${favorWord(c.favor[g.id])} (${c.favor[g.id]})</span></div>`).join('')}</div>`;
  const marks = Object.keys(c.marks).filter((m) => c.marks[m] > 0);
  const chron = `<div class="card"><div class="place" style="text-align:left;margin-bottom:4px">Co o was mówią</div>${marks.length ? marks.map((m) => `<div class="mark">${esc(MARKS[m].label)}</div>`).join('') : '<div class="empty">Jeszcze nic. To się zmieni.</div>'}
<div class="place" style="text-align:left;margin:10px 0 4px">Wiedza</div>${c.knowledge.length ? c.knowledge.map((k) => `<div class="mark know">${esc(KNOWLEDGE[k].name)} <span class="muted small">— ${esc(KNOWLEDGE[k].desc)}</span></div>`).join('') : '<div class="empty">Nikt jeszcze niczego nie przyniósł oprócz błota.</div>'}
<div class="place" style="text-align:left;margin:10px 0 4px">Polegli</div>${c.chronicle.length ? c.chronicle.slice().reverse().map((e) => `<div class="chron"><b>${esc(e.name)}</b> — ${esc(e.cause)}. ${esc(e.place)}, dzień ${e.day}.</div>`).join('') : '<div class="empty">Kronika jest pusta. Cech uważa to za dobry znak. Cech się myli.</div>'}</div>`;
  return `<div class="screen"><div class="scroll"><div class="city-head"><h1 class="title">Odmęt</h1><div class="sub">dzień ${c.day} · skarbiec: ${c.gold} ${pl(c.gold, M)} · ${c.expeditions} ${pl(c.expeditions, ['wyprawa', 'wyprawy', 'wypraw'])}</div></div>
<div class="pad">${section('Bohater', hero)}${section(G.name, guild)}${section('Tawerna pod Wagą', tavern)}${section('Bogowie', gods)}${section('Kronika', chron)}</div></div>
<div class="actions">${btn('city.go', '', 'Wyrusz', `${esc(contract.name)} · ${contract.length} ${pl(contract.length, ['przejście', 'przejścia', 'przejść'])}${UI.party.length ? ' · z ' + UI.party.map((id) => COMPANIONS[id].short).join(', ') : ''}`, 'primary')}<div class="btn-grid">${btn('inv', '', 'Ekwipunek', '', 'ghost sm')}${btn('menu', '', 'Więcej', '', 'ghost sm')}</div></div></div>`;
};

/* ---------- mapa ---------- */
SCREENS.map = (S) => {
  const exp = S.exp, region = REGIONS[exp.regionId], phase = phaseOf(exp.step), cur = exp.map.nodes[exp.cur], next = nextNodes(S);
  return `<div class="screen"><div class="maphead"><div><div class="name">${esc(region.name)}</div><div class="muted small">${esc(exp.contract.name)}</div></div><div class="right"><div>dzień ${dayOf(exp.step)} · ${esc(phase.label.toLowerCase())}</div><div class="gold">${S.hero.gold} ${pl(S.hero.gold, M)}</div></div></div>
<div class="mapwrap">${mapSVG(S)}</div>
<div class="mapfoot"><div class="mini">${exp.party.map((u) => unitCard(u)).join('')}</div>
<div class="center small muted" style="margin-bottom:6px">${next.length ? (cur.depth === 0 ? 'Brama za wami. Wybierz węzeł na mapie.' : 'Wybierz następny węzeł — albo zawróć z tym, co masz.') : 'Węzeł nierozstrzygnięty.'}</div>
<div class="row" style="align-items:stretch"><button class="btn ghost sm" style="width:auto;flex:none;margin:0" data-act="inv"><span class="lbl">Sakwa</span></button><div class="grow">${btn('return', '', 'Wróć do miasta', cur.depth === 0 ? 'najpierw wyjdź' : `łup: ${S.hero.gold} ${pl(S.hero.gold, M)}`, (cur.kind === 'cel' ? 'primary sm' : 'ghost sm') + ' m0', !cur.resolved || cur.depth === 0)}</div></div></div></div>`;
};

/* ---------- spotkanie: wybór / walka (wstęp) / odpoczynek ---------- */
SCREENS.encounter = (S) => {
  const exp = S.exp, enc = exp.encounter, region = REGIONS[exp.regionId];
  const actor = enc.kind === 'wybor' ? findActor(region, enc.actorId) : null;
  const ctx = makeCtx(S);
  let body = '', actions = '';
  if (enc.stage === 'open') {
    body = paras(enc.text);
    if (enc.kind === 'wybor') actions = choiceOptions(S, enc).map((o) => btn('choose', o.i, esc(typeof o.ch.label === 'function' ? o.ch.label(ctx) : o.ch.label), typeof o.ch.cost === 'function' ? o.ch.cost(ctx) : o.ch.cost)).join('');
    else if (enc.kind === 'walka') actions = btn('fight', '', 'Do broni', `${enc.enemies.length} ${pl(enc.enemies.length, ['przeciwnik', 'przeciwników', 'przeciwników'])}${enc.ambush ? ' · zasadzka' : ''}`, 'danger');
    else {
      const gods = godsAt(S).filter((g) => !enc.prayed[g.id]);
      if (enc.lastResult) body += `<div class="card">${paras(enc.lastResult.text)}${fxLines(enc.lastResult.fx)}</div>`;
      const risk = region.ambushChance(ctx), rw = (p) => (p < 0.1 ? 'małe' : p < 0.25 ? 'średnie' : 'duże');
      actions = (gods.length ? `<div class="place" style="margin:0 0 8px">Modlitwa</div>` + gods.map((g) => btn('rest.pray', g.id, esc(g.name), `${favorWord(S.city.favor[g.id])}`, '', false, emblem(g.emblem, 'sm god'))).join('') : '')
        + `<div class="place" style="margin:6px 0 8px">Nocleg</div>`
        + (S.hero.items.sol ? btn('rest.sleep', 'sol', 'Śpij w kręgu soli', '1 sól · bez ryzyka') : '')
        + (S.hero.items.pochodnia ? btn('rest.sleep', 'pochodnia', 'Śpij przy pochodni', `1 pochodnia · ryzyko ${rw(risk * 0.5)}`) : '')
        + btn('rest.sleep', '', 'Śpij po ciemku', `ryzyko ${rw(risk)}`)
        + btn('rest.watch', '', 'Czuwaj na zmianę', 'mniej snu, bez ryzyka');
    }
  } else {
    body = paras(enc.result.text) + fxLines(enc.result.fx);
    actions = enc.combat ? btn('enc.fight', '', 'Do broni', `${enc.combat.enemies.length} ${pl(enc.combat.enemies.length, ['przeciwnik', 'przeciwników', 'przeciwników'])}`, 'danger') : btn('enc.next', '', enc.kind === 'odpoczynek' ? 'Ruszaj dalej' : 'Dalej', '', 'primary');
  }
  return `<div class="screen">${sceneHTML(S, { placeId: enc.placeId, actor })}<div class="scroll pad prose">${body}</div><div class="actions">${actions}</div></div>`;
};

/* ---------- walka ---------- */
SCREENS.combat = (S) => {
  const cb = S.combat, exp = S.exp, enc = exp.encounter;
  const turnUnit = cb.turn ? findUnit(S, cb.turn) : null;
  const tgt = !!cb.pending;
  const overlay = `<div class="enemies">${cb.enemies.map((e) => { const gone = e.hp <= 0 || e.fled; return `<div class="eunit${gone ? ' gone' : ''}${tgt && !gone ? ' targetable' : ''}" data-uid="${e.uid}" ${tgt && !gone ? `data-act="cb.target" data-arg="${e.uid}"` : ''}>${emblem(ENEMIES[e.kind].emblem, 'enemy' + (e.hp <= 0 ? ' dead' : ''))}<div class="name">${esc(e.name)}</div><div class="bar"><i style="width:${Math.round((100 * e.hp) / e.maxHp)}%"></i></div><div class="tags">${e.fled ? '<span class="tag">uciekł</span>' : statusTags(e)}</div></div>`; }).join('')}</div>`;
  let actions = '', extra = '';
  if (cb.phase === 'done') { if (cb.how !== 'death') { extra = `<div class="pad prose">${paras(cb.result.text)}${fxLines(cb.result.fx)}</div>`; actions = btn('cb.done', '', 'Dalej', '', 'primary'); } else actions = `<div class="center blood sc" style="padding:12px">…</div>`; }
  else if (cb.phase === 'player' && turnUnit) {
    if (tgt) actions = `<div class="center small gold" style="margin-bottom:8px">Wskaż cel na scenie.</div>${btn('cb.cancel', '', 'Anuluj', '', 'ghost sm')}`;
    else { const ab = abilityOf(turnUnit), items = usableInCombat(S); actions = `<div class="center small muted" style="margin-bottom:8px">Ruch: <span class="gold sc">${esc(turnUnit.short)}</span></div><div class="btn-grid">${btn('cb.act', 'atak', 'Atak', `${turnUnit.atk[0]}–${turnUnit.atk[1]}`)}${btn('cb.act', 'zdolnosc', esc(ab.name), `${ab.mp} woli`, '', turnUnit.mp < ab.mp)}${btn('cb.items', '', 'Przedmiot', items.length ? `${items.length} ${pl(items.length, ['rodzaj', 'rodzaje', 'rodzajów'])}` : 'brak', '', !items.length)}${btn('cb.act', 'ucieczka', 'Ucieczka', 'ryzyko')}</div>`; }
  } else actions = `<div class="center small muted" style="padding:14px">…</div>`;
  return `<div class="screen">${sceneHTML(S, { placeId: enc.placeId, overlay })}<div class="scroll"><div class="log">${cb.log.slice(-3).map((l) => `<div>${esc(l)}</div>`).join('')}</div><div class="party">${exp.party.map((u) => unitCard(u, u.uid === cb.turn ? 'active' : '')).join('')}</div>${extra}</div><div class="actions">${actions}</div></div>`;
};

/* ---------- rozliczenie ---------- */
SCREENS.reckoning = (S) => {
  const r = S.reck, e = r.entries[r.i], last = r.i === r.entries.length - 1;
  return `<div class="screen"><div class="scroll pad"><div class="place">Rozliczenie w Cechu · ${r.i + 1} z ${r.entries.length}</div><h2 class="title" style="font-size:28px;margin:8px 0">${esc(e.title)}</h2>${rule()}<div class="prose">${paras(e.text)}${fxLines(e.fx)}</div></div>
<div class="actions">${e.choice ? e.choice.map((ch, k) => btn('reck.choice', k, esc(ch.label), ch.cost)).join('') : btn('reck.next', '', last ? 'Do miasta' : 'Dalej', '', 'primary')}</div></div>`;
};

/* ---------- śmierć ---------- */
SCREENS.death = (S) => {
  const d = S.death, e = d.entry;
  return `<div class="screen death"><div class="scroll"><div style="height:24px"></div><h1 class="title">Kronika</h1>${emblem(d.emblem || 'token', 'xl dead')}
<div class="prose" style="text-align:center;font-size:18px">${esc(e.name)}, ${esc(e.arch)}<br><span class="muted">— ${esc(e.cause)}.</span><br><span class="small muted">${esc(e.place)}, dzień ${e.day}, ${e.n}. wyprawa Odmętu.</span></div>${rule()}
<div class="prose small" style="text-align:left"><p><span class="sc gold">Przepadło:</span> ${d.lost.gold ? `${d.lost.gold} ${pl(d.lost.gold, M)}` : 'ani monety'}${d.lost.items.length ? ', ' + d.lost.items.map(esc).join(', ').toLowerCase() : ''}. ${d.survivors.length ? `<span class="sc gold">${d.survivors.map(esc).join(' i ')}</span> ${d.survivors.length > 1 ? 'wracają sami' : (e.f ? 'wraca sama' : 'wraca sama')}. Nie mówi, co ${d.survivors.length > 1 ? 'widzieli' : 'widziała'}.` : ''}</p>
<p class="sc gold" style="margin-bottom:4px">Co zostaje w Odmęcie:</p>${d.kept.map((k) => `<div class="mark know">${esc(k)}</div>`).join('')}</div></div>
<div class="actions">${btn('death.next', '', 'Wróć do Odmętu', 'ktoś musi iść następny', 'primary')}</div></div>`;
};

/* ---------- arkusze ---------- */
function sheetHTML(S) {
  let inner = '';
  if (UI.sheet === 'menu') inner = `<h2 class="h">Odmęt</h2><p class="small muted">Zapis jest automatyczny i zostaje w tej przeglądarce. „Nowa gra" wymazuje Kronikę, reputację i ludzi — wszystko, co miasto pamięta.</p>${btn('newgame', '', 'Nowa gra', 'wymazuje pamięć miasta', 'danger')}${btn('sheet.close', '', 'Zamknij', '', 'ghost')}`;
  else if (UI.sheet === 'inv') {
    const h = S.hero, ids = Object.keys(h.items).filter((k) => h.items[k] > 0);
    const party = partyAlive(S);
    inner = `<h2 class="h">Ekwipunek</h2><div class="scroll">${ids.length ? ids.map((k) => { const it = ITEMS[k]; return `<div class="card"><div class="row"><div class="grow"><div class="name">${esc(it.name)} <span class="gold">×${h.items[k]}</span></div><div class="small muted">${esc(it.desc)}</div></div></div>${it.anywhere && S.screen !== 'combat' ? `<div class="btn-grid" style="margin-top:8px">${party.map((u) => btn('use', `${k}|${u.uid}`, `${esc(it.name)} → ${esc(u.short)}`, '', 'sm', u.hp >= u.maxHp)).join('')}</div>` : ''}</div>`; }).join('') : '<div class="empty">Pusta sakwa. Bagno to zauważy.</div>'}<div class="small muted" style="margin:4px 0 10px">Skarbiec miasta: ${S.city.gold} ${pl(S.city.gold, M)}${h ? ` · przy sobie: ${h.gold} ${pl(h.gold, M)}` : ''}</div></div>${btn('sheet.close', '', 'Zamknij', '', 'ghost')}`;
  } else if (UI.sheet === 'cbitems') {
    const ids = usableInCombat(S);
    inner = `<h2 class="h">Przedmiot</h2>${ids.map((k) => btn('cb.item', k, `${esc(ITEMS[k].name)} <span class="gold">×${S.hero.items[k]}</span>`, ITEMS[k].desc)).join('')}${btn('sheet.close', '', 'Anuluj', '', 'ghost')}`;
  }
  return `<div class="sheet" data-act="sheet.close"><div class="panel" data-act="noop">${inner}</div></div>`;
}
function confirmHTML() { return `<div class="confirm"><div class="box"><h2 class="h">Zacząć od nowa?</h2><p class="prose small">Odmęt zapomni wszystko: Kronikę, reputację, długi, ludzi. Bagno nie zapomni, ale bagno i tak nikogo nie słucha.</p>${btn('confirm.yes', '', 'Tak, od nowa', '', 'danger')}${btn('confirm.no', '', 'Nie', '', 'ghost')}</div></div>`; }

/* ---------- render ---------- */
function afterRender() { if (FX.p) { FX.p.stop(); FX.p = null; } const cv = $('.scene canvas.fx'); if (cv) FX.p = new Particles(cv, cv.dataset.mode, cv.dataset.night === '1'); }
let LAST_SCREEN = null;
function render() {
  const app = $('#app'), fn = SCREENS[S.screen] || SCREENS.title;
  app.innerHTML = fn(S) + (UI.sheet ? sheetHTML(S) : '') + (UI.confirm ? confirmHTML() : '');
  if (LAST_SCREEN !== S.screen) { const sc = $('.screen'); if (sc) sc.classList.add('enter'); LAST_SCREEN = S.screen; }
  afterRender(); flushFX();
}
function startNewGame() { wipe(); S = newState(); S.screen = 'create'; UI.arch = null; UI.name = genName(RNG); UI.party = []; UI.contract = 0; UI.sheet = null; UI.confirm = null; UI.resume = null; save(); render(); }

/* ---------- zdarzenia ---------- */
const ACTIONS = {
  noop: () => {},
  new: () => { if (S.hero || S.city.expeditions || S.city.heroes) { UI.confirm = 'newgame'; render(); } else startNewGame(); },
  newgame: () => { UI.confirm = 'newgame'; render(); },
  continue: () => { S.screen = UI.resume || 'city'; UI.resume = null; if (!S.hero && S.screen !== 'death' && S.screen !== 'create') S.screen = 'create'; if (S.screen === 'create') { UI.arch = null; UI.name = null; } save(); render(); if (S.screen === 'combat' && S.combat && S.combat.phase !== 'player' && S.combat.phase !== 'done') setTimeout(() => combatStep(S), 400); },
  'confirm.yes': () => startNewGame(),
  'confirm.no': () => { UI.confirm = null; render(); },
  pickArch: (id) => { UI.arch = id; render(); },
  reroll: () => { UI.name = genName(RNG); render(); },
  create: () => { if (!UI.arch) return; createHero(S, UI.arch, UI.name); UI.arch = null; UI.name = null; render(); },
  'city.contract': (i) => { UI.contract = +i; render(); },
  'city.comp': (id) => { const i = UI.party.indexOf(id); if (i >= 0) UI.party.splice(i, 1); else if (UI.party.length < CFG.party.maxCompanions) UI.party.push(id); render(); },
  'city.go': () => { const c = S.city.contracts[UI.contract] || S.city.contracts[0]; startExpedition(S, c, UI.party); render(); },
  'city.buy': (id) => { buyUpgrade(S, id); render(); },
  menu: () => { UI.sheet = 'menu'; render(); },
  inv: () => { UI.sheet = 'inv'; render(); },
  'sheet.close': () => { UI.sheet = null; render(); },
  use: (arg) => { const [id, uid] = arg.split('|'); useItem(S, id, uid); render(); },
  go: (id) => { enterNode(S, +id); render(); },
  return: () => { returnToCity(S); render(); },
  choose: (i) => { chooseOption(S, +i); render(); },
  'enc.next': () => { resolveNode(S); render(); },
  'enc.fight': () => { const enc = S.exp.encounter, c = enc.combat; if (!c) return; enc.combat = null; startCombat(S, c); render(); },
  fight: () => { const enc = S.exp.encounter; if (enc.kind !== 'walka' || enc.stage !== 'open') return; enc.stage = 'fight'; startCombat(S, { enemies: enc.enemies, ambush: enc.ambush, after: 'map' }); render(); },
  'rest.pray': (gid) => { pray(S, gid); render(); },
  'rest.sleep': (ward) => { restDo(S, 'sleep', ward || null); render(); },
  'rest.watch': () => { restDo(S, 'watch'); render(); },
  'cb.act': (a) => playerAct(S, a),
  'cb.target': (uid) => { const p = S.combat && S.combat.pending; if (!p) return; playerAct(S, p.action, uid, p.itemId); },
  'cb.cancel': () => { if (S.combat) S.combat.pending = null; render(); },
  'cb.items': () => { UI.sheet = 'cbitems'; render(); },
  'cb.item': (id) => { UI.sheet = null; playerAct(S, 'przedmiot', null, id); render(); },
  'cb.done': () => { afterCombat(S); render(); },
  'reck.next': () => { const r = S.reck; if (r.i < r.entries.length - 1) r.i++; else { S.reck = null; S.screen = 'city'; } save(); render(); },
  'reck.choice': (k) => { reckChoice(S, +k); render(); },
  'death.next': () => { S.death = null; S.screen = 'create'; UI.arch = null; UI.name = null; save(); render(); },
};

/* ============================================================
   6. START
   ============================================================ */
function boot() {
  try { $('#paper').style.backgroundImage = `url(${paperTexture()})`; } catch (e) { }
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]'); if (!el) return;
    if (el.dataset.act === 'noop') { ev.stopPropagation(); return; }
    ev.preventDefault(); ev.stopPropagation();
    const fn = ACTIONS[el.dataset.act]; if (fn) fn(el.dataset.arg, el);
  });
  const s = load();
  if (s) { S = s; S.pendingCombat = null; UI.resume = S.screen && S.screen !== 'title' ? S.screen : (S.hero ? 'city' : 'create'); if (S.exp && !S.hero) UI.resume = 'create'; S.screen = 'title'; }
  else S = newState();
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (FX.p) { FX.p.stop(); FX.p = null; } } else afterRender(); });
  window.addEventListener('resize', () => { if (FX.p) FX.p.resize(); });
  render();
}
boot();
</script>
</body>
</html>
