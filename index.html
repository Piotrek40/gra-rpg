<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14110d">
<title>Odmęt</title>
<style>
/* ============================================================
   ODMĘT — atrament na ciemnym pergaminie
   Paleta (6 kolorów): tło, pergamin, atrament, złoto pochodni,
   krew, bagienna zieleń. Ta sama od tytułu po ekran śmierci.
   ============================================================ */
:root{
  --bg:#14110d;
  --paper:#241d15;
  --ink:#d8c69c;
  --gold:#e0a441;
  --blood:#9a2f2a;
  --bog:#4e7f7a;
  --ink-40:rgba(216,198,156,.4);
  --ink-20:rgba(216,198,156,.2);
  --ink-10:rgba(216,198,156,.1);
  --gold-30:rgba(224,164,65,.3);
  --serif:"Noto Serif","Georgia","Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.5;overflow:hidden;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none;touch-action:manipulation}
#paper{position:fixed;inset:0;pointer-events:none;opacity:.07;z-index:0;background-repeat:repeat}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,0,0,.55) 100%)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.screen.enter{animation:fadeIn .35s ease-out}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad{padding:14px 16px}
h1,h2,h3{font-weight:normal;margin:0}
.sc{font-variant-caps:small-caps;letter-spacing:.09em}
.title{font-size:44px;letter-spacing:.18em;text-align:center;font-variant-caps:small-caps;color:var(--ink);text-shadow:0 0 24px var(--gold-30)}
.sub{text-align:center;color:var(--ink-40);font-style:italic;font-size:15px}
.h{font-size:15px;color:var(--gold);text-transform:none;font-variant-caps:small-caps;letter-spacing:.14em;margin:0 0 6px}
.muted{color:var(--ink-40)}
.gold{color:var(--gold)}
.blood{color:#c9443c}
.bog{color:#7fb3ac}
.right{text-align:right}
.center{text-align:center}
.small{font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}

/* --- ozdobniki --- */
.rule{display:flex;align-items:center;gap:10px;color:var(--ink-40);margin:10px 0}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--ink-40),transparent)}
.rule svg{width:14px;height:14px;fill:none;stroke:var(--gold);stroke-width:1.2}

/* --- przyciski: min. 48 px, tylko dotyk --- */
.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:54px;padding:10px 14px;margin:0 0 8px;background:rgba(36,29,21,.75);border:1px solid var(--ink-40);border-radius:4px;color:var(--ink);font:inherit;font-size:17px;text-align:left;line-height:1.3;cursor:pointer;position:relative;overflow:hidden}
.btn .lbl{font-variant-caps:small-caps;letter-spacing:.06em;flex:1}
.btn .cost{font-size:13px;color:var(--ink-40);font-style:italic;white-space:nowrap;letter-spacing:0;text-align:right}
.btn:active{border-color:var(--gold);background:rgba(224,164,65,.12)}
.btn.primary{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-30),0 0 18px rgba(224,164,65,.12)}
.btn.primary .lbl{color:var(--gold)}
.btn.danger{border-color:rgba(154,47,42,.7)}
.btn.danger .lbl{color:#c9443c}
.btn.ghost{background:transparent;border-color:var(--ink-20)}
.btn.sm{min-height:48px;font-size:15px;padding:8px 12px}
.btn.m0{margin:0;height:100%}
.btn:disabled{opacity:.38;pointer-events:none}
.btn .emb{flex:none}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-grid .btn{margin:0;justify-content:center;text-align:center}
.btn-grid .btn .lbl{flex:none}
.actions{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--ink-10);background:linear-gradient(180deg,rgba(20,17,13,0),rgba(20,17,13,.92) 30%)}

/* --- karty --- */
.card{border:1px solid var(--ink-20);background:rgba(36,29,21,.65);border-radius:6px;padding:12px 14px;margin:0 0 10px}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-30)}
.card.dim{opacity:.55}
.emb{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(36,29,21,.9),rgba(20,17,13,1));flex:none;position:relative}
.emb svg{width:70%;height:70%;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.emb.lg{width:76px;height:76px}
.emb.xl{width:110px;height:110px;border-width:2px}
.emb.sm{width:44px;height:44px}
.emb.enemy{border-color:rgba(154,47,42,.8)}
.emb.enemy svg{stroke:#d9c9a3}
.emb.god{border-color:var(--gold)}
.emb.dead{border-color:var(--ink-20);opacity:.5}
.emb.dead::after{content:"";position:absolute;inset:-2px;border-radius:50%;background:linear-gradient(135deg,transparent 47%,var(--blood) 48%,var(--blood) 52%,transparent 53%)}
.name{font-variant-caps:small-caps;letter-spacing:.06em;font-size:18px}
.bars{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.bar{height:7px;background:rgba(0,0,0,.45);border:1px solid rgba(0,0,0,.6);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blood);transition:width .35s ease}
.bar.mp i{background:var(--bog)}
.bar.rep i{background:var(--gold)}
.stat{font-size:13px;color:var(--ink-40);display:flex;justify-content:space-between}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border:1px solid var(--ink-20);border-radius:10px;color:var(--ink-40);margin:2px 4px 2px 0;font-variant-caps:small-caps;letter-spacing:.06em}
.tag.st{border-color:var(--bog);color:#7fb3ac}
.tag.bad{border-color:rgba(154,47,42,.7);color:#c9443c}

/* --- proza --- */
.prose{font-size:17px;line-height:1.55}
.prose p{margin:0 0 .9em}
.prose p.cap::first-letter{float:left;font-size:3.1em;line-height:.82;padding:.08em .12em 0 0;color:var(--gold);font-variant-caps:normal}
.prose .say{font-style:italic}
.fx-line{font-size:14px;color:var(--gold);font-variant-caps:small-caps;letter-spacing:.06em;margin:6px 0 10px;padding:8px 10px;border-left:2px solid var(--gold-30);background:rgba(224,164,65,.05)}
.fx-line.bad{color:#c9443c;border-color:rgba(154,47,42,.6);background:rgba(154,47,42,.06)}
.place{font-size:13px;color:var(--ink-40);font-variant-caps:small-caps;letter-spacing:.14em;text-align:center}

/* --- scena --- */
.scene{position:relative;height:36vh;min-height:190px;max-height:330px;overflow:hidden;flex:none;background:var(--bg)}
.scene .sky{position:absolute;inset:0;transition:background 1.2s}
.scene svg.sil{position:absolute;left:0;bottom:0;width:100%;height:100%;fill:#0e0c09;stroke:none}
.scene .water{position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(180deg,rgba(78,127,122,.0),rgba(78,127,122,.22) 40%,rgba(14,12,9,.9));opacity:.9}
.scene .water::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 5px,rgba(216,198,156,.05) 5px 6px)}
.scene canvas.fx{position:absolute;inset:0;width:100%;height:100%}
.scene .torch{position:absolute;left:-30%;right:-30%;bottom:-40%;height:120%;background:radial-gradient(ellipse at 50% 100%,rgba(224,164,65,.28),rgba(224,164,65,.08) 35%,transparent 62%);animation:flicker 2.4s infinite steps(1);pointer-events:none;mix-blend-mode:screen}
.scene .torch.off{display:none}
.scene .dark{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,17,13,.1),rgba(20,17,13,.0) 40%,rgba(20,17,13,.75))}
.scene .head{position:absolute;left:0;right:0;top:10px;text-align:center;text-shadow:0 1px 4px #000}
.scene .actor{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;text-shadow:0 1px 4px #000}
.scene .actor .emb{box-shadow:0 0 30px rgba(224,164,65,.25)}
.enemies{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:14px;padding:0 10px}
.eunit{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:96px;padding:6px 6px 8px;border-radius:8px;border:1px solid transparent;position:relative}
.eunit.target{border-color:var(--gold);background:rgba(224,164,65,.08)}
.eunit.targetable{border-color:var(--ink-20)}
.eunit.gone{opacity:.25}
.eunit .name{font-size:14px;text-shadow:0 1px 4px #000}
.eunit .bar{width:80px}
.eunit .tags{min-height:16px;text-align:center}
.eunit .tag{font-size:11px;padding:0 5px;margin:0 2px}

/* --- walka --- */
.party{display:flex;gap:8px;padding:10px 12px 0}
.punit{flex:1;border:1px solid var(--ink-20);background:rgba(36,29,21,.7);border-radius:6px;padding:8px;position:relative;min-width:0}
.punit.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-30)}
.punit.dead{opacity:.45}
.punit .name{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.punit .row{gap:8px}
.log{padding:8px 16px;font-size:15px;min-height:64px;max-height:96px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.log div{opacity:.45}
.log div:last-child{opacity:1}
.float{position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:22px;color:#c9443c;text-shadow:0 1px 6px #000;animation:floatUp .9s ease-out forwards;pointer-events:none;font-variant-caps:small-caps;letter-spacing:.06em;white-space:nowrap;z-index:5}
.float.heal{color:#7fb3ac}
.float.gold{color:var(--gold)}
.float.miss{color:var(--ink-40);font-size:16px;font-style:italic}
.shake{animation:shake .32s linear}
.flash{position:fixed;inset:0;pointer-events:none;z-index:9;background:rgba(154,47,42,.35);animation:flash .4s ease-out forwards}
.flash.fire{background:rgba(224,164,65,.28)}

/* --- mapa --- */
.mapwrap{flex:1;min-height:0;position:relative;overflow:hidden}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.maphead{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--ink-10);font-size:14px}
.maphead .name{font-size:16px}
.mapfoot{padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--ink-10);background:rgba(20,17,13,.92)}
.mini{display:flex;gap:8px;margin-bottom:8px}
.mini .punit{padding:6px 8px}
.node{cursor:pointer}
.node .ring{fill:none;stroke:var(--gold);stroke-width:1;stroke-dasharray:3 4;opacity:.9;animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.node.cur .core{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.fogblob{animation:drift 9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}

/* --- arkusze / nakładki --- */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,8,6,.82);display:flex;flex-direction:column;justify-content:flex-end;animation:fadeIn .2s}
.sheet .panel{background:var(--paper);border-top:1px solid var(--ink-40);border-radius:12px 12px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));max-height:80vh;display:flex;flex-direction:column}
.sheet .panel .scroll{flex:1}
.sheet .panel .btn{margin-bottom:8px}
.confirm{position:fixed;inset:0;z-index:30;background:rgba(10,8,6,.9);display:grid;place-items:center;padding:24px}
.confirm .box{border:1px solid var(--ink-40);background:var(--paper);padding:18px;max-width:340px;width:100%}

/* --- miasto --- */
.city-head{padding:12px 16px 6px;text-align:center}
.city-head .title{font-size:32px}
.section{margin:0 0 6px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:15px;padding:3px 0;border-bottom:1px dashed var(--ink-10)}
.kv:last-child{border-bottom:0}
.chron{font-size:15px;padding:6px 0;border-bottom:1px dashed var(--ink-10)}
.chron b{font-weight:normal;font-variant-caps:small-caps;letter-spacing:.05em;color:var(--gold)}
.mark{font-size:15px;padding:4px 0;font-style:italic;color:var(--ink)}
.mark::before{content:"◆ ";color:var(--blood);font-style:normal}
.know::before{content:"◆ ";color:var(--bog);font-style:normal}
.empty{font-style:italic;color:var(--ink-40);font-size:15px;padding:4px 0}
.inv{display:flex;flex-wrap:wrap;gap:6px}
.inv .item{border:1px solid var(--ink-20);border-radius:4px;padding:4px 10px;font-size:14px;min-height:40px;display:flex;align-items:center;gap:6px}
.inv .item b{font-weight:normal;color:var(--gold)}

/* --- śmierć --- */
.death{justify-content:center;text-align:center;padding:24px}
.death .title{font-size:30px;color:#c9443c;text-shadow:0 0 30px rgba(154,47,42,.4)}
.death .emb.xl{margin:16px auto}
.death .prose{text-align:left}

/* --- animacje --- */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes flicker{0%{opacity:.85}9%{opacity:1}21%{opacity:.8}33%{opacity:.95}47%{opacity:.75}58%{opacity:1}69%{opacity:.86}82%{opacity:.97}93%{opacity:.8}100%{opacity:.9}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
@keyframes flash{from{opacity:1}to{opacity:0}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,6px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-38px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translate(-4px,0) scale(1)}to{transform:translate(5px,2px) scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="paper"></div>
<div id="vignette"></div>
<div id="app"></div>
<script>
'use strict';
/* ============================================================
   0. KONFIGURACJA — jedyne miejsce, w którym są liczby skali
   i treści. Silniki niżej nie znają żadnych nazw z tej sekcji.
   Dodanie regionu / aktora / wroga / boga = dopisanie wpisu.
   ============================================================ */
const CFG = {
  version: 1,
  saveKey: 'odmet.save',
  city: { name: 'Odmęt', districts: ['spod Wagi', 'z Rybnej', 'z Przystani', 'znad Kanału', 'z Solnego Kąta', 'zza Łańcucha'] },
  phases: [
    { id: 'świt',     label: 'Świt',     night: false, sky: ['#2a2420', '#5a4634', '#1a1712'] },
    { id: 'dzień',    label: 'Dzień',    night: false, sky: ['#3a3a33', '#6b6656', '#1a1712'] },
    { id: 'zmierzch', label: 'Zmierzch', night: false, sky: ['#241a1c', '#7a3f2a', '#14110d'] },
    { id: 'noc',      label: 'Noc',      night: true,  sky: ['#0b0d12', '#1b2430', '#0a0908'] },
  ],
  stepsPerPhase: 2,
  party: { maxCompanions: 2 },
  map: { minPerLayer: 2, maxPerLayer: 3, extraEdgeChance: 0.4, restWindow: 3, revealAhead: 1 },
  contracts: { baseLength: 4, longExtra: 2, maxLength: 9, goldPerLayer: 3, repPerLayer: 1 },
  advance: { gold: 5, interest: 1 },
  rep: { goldPerPoint: 5 },
  rest: { sleepHeal: 0.55, watchHeal: 0.25, watchMana: 0.5 },
  combat: { fleeBase: 0.5, delay: 520, maxGroup: 3 },
  balance: { woundedBelow: 0.5, healthyAbove: 0.8, poorBelow: 4, richAbove: 15, favorCap: 6, scarHp: 2, scarFloor: 8 },
};

/* ---------- archetypy bohatera ---------- */
const ARCHETYPES = {
  rebajlo: {
    id: 'rebajlo', name: 'Rębajło', emblem: 'axe',
    desc: 'Z Przystani. Umie dwie rzeczy: uderzyć i wstać. Cech ceni pierwszą, bagno sprawdza drugą.',
    hp: 30, mp: 4, atk: [5, 8], def: 1, spd: 3, kit: { pochodnia: 1, wywar: 1 },
    ability: { id: 'rozplatanie', name: 'Rozpłatanie', mp: 2, target: 'enemy', desc: 'Cios, przed którym nie da się umknąć. 9–13.',
      effects: (u, t, rng) => [{ type: 'damage', target: t, amount: rng.int(9, 13), dmgType: 'phys', sure: true }],
      text: (u, t) => `${u.name} rozpłatuje: ${t.name}.` },
  },
  adept: {
    id: 'adept', name: 'Adept', emblem: 'eye',
    desc: 'Wyrzucony z wieży za pytania. Nosi ogień w głowie i za mało mięsa na kościach.',
    hp: 20, mp: 10, atk: [2, 4], def: 0, spd: 4, kit: { wywar: 1, sol: 1 },
    ability: { id: 'zar', name: 'Żar', mp: 3, target: 'enemy', desc: 'Płomień. 7–10, ogień. Odsłania to, co się chowa.',
      effects: (u, t, rng) => [{ type: 'damage', target: t, amount: rng.int(7, 10), dmgType: 'fire' }, { type: 'status', target: t, status: 'odsloniety', turns: 2 }],
      text: (u, t) => `${u.name} ciska żar: ${t.name}.` },
  },
};

/* ---------- towarzysze ---------- */
const COMPANIONS = {
  ida: {
    id: 'ida', name: 'Ida Smolna', short: 'Ida', f: true, emblem: 'net',
    desc: 'Dezerterka ze straży bagiennej Cechu. Zna warty, zna trzciny, nie pije, bo nie ma za co.',
    hp: 22, mp: 5, atk: [4, 6], def: 1, spd: 5,
    ability: { id: 'siec', name: 'Sieć', mp: 2, target: 'enemy', desc: 'Rzut siecią. Cel traci następny ruch.',
      effects: (u, t) => [{ type: 'status', target: t, status: 'stun', turns: 1 }],
      text: (u, t) => `${u.name} rzuca sieć: ${t.name} zapomina, po co wstał.` },
    restWard: 0.5,
    tavern: 'Siedzi tyłem do drzwi, co w Tawernie pod Wagą jest albo odwagą, albo rachunkiem.',
    deathCause: 'została na Bagnach',
  },
};

/* ---------- przeciwnicy: zachowanie wynika z rodzaju ---------- */
const ENEMIES = {
  topielec: {
    id: 'topielec', name: 'Topielec', forms: ['topielec', 'topielce', 'topielców'], emblem: 'drownedHand',
    hp: 15, atk: [4, 7], def: 1, spd: 1, tags: ['nieumarły', 'woda'], weak: { fire: 1.5 }, resist: {}, evasion: 0,
    deathCause: 'zabrał topielec',
    weight(ctx) { let w = 1; if (ctx.mark('obrabowales_topielca')) w *= 2; if (ctx.mark('ograbiles_kaplice')) w *= 2; if (ctx.mark('minales_topielca')) w *= 1.5; if (ctx.place && ctx.place.tags.includes('umarli')) w *= 1.6; return w; },
    ai(self, cb) {
      const held = self.grab != null ? cb.party.find(u => u.uid === self.grab && u.hp > 0) : null;
      if (held) { self.grab = null; return { text: `${self.name} wciąga pod wodę: ${held.name}.`, effects: [{ type: 'damage', target: held, amount: Math.round(cb.rng.int(self.atk[0], self.atk[1]) * 1.5), dmgType: 'phys' }] }; }
      const t = cb.weakest();
      return { text: `${self.name} chwyta: ${t.name}.`, effects: [{ type: 'damage', target: t, amount: cb.rng.int(self.atk[0], self.atk[1]), dmgType: 'phys', onHit: () => { self.grab = t.uid; cb.status(t, 'pochwycony', 1); } }] };
    },
    onDamaged(self) { self.grab = null; },
    regen(self, cb) { return cb.placeTags.includes('woda') ? 1 : 0; },
    intro(ctx, n) {
      if (n === 1) return `Woda przed wami wstaje. Nie jak fala — jak człowiek, który wstaje z łóżka, powoli, bo wie, że ma czas. Topielec ma jeszcze na szyi ołowiany znak Cechu. Dług spłacony, sprawa niezamknięta.`;
      return `Woda przed wami wstaje w ${n === 2 ? 'dwóch' : 'kilku'} miejscach naraz. Topielce nie śpieszą się; nikt tu się nie śpieszy, kto ma na szyi ołów. Idą, jakby ktoś ich wezwał z nazwiska.`;
    },
    victory(ctx, n) { return n === 1 ? `Topielec opada w wodę tak samo, jak z niej wstał: bez pośpiechu, bez urazy. Ołowiany znak na jego szyi błyska raz i tonie. Zostajecie z mokrym oddechem i pewnością, że nie zrobiliście mu krzywdy — tylko przerwę.` : `Ostatni topielec kładzie się na wodzie i woda go przyjmuje. Nie ma tu zwycięstwa, tylko spokój, który potrwa tyle, ile wasza uwaga.`; },
    loot(rng) { const l = { gold: rng.int(2, 5) }; if (rng.chance(0.25)) l.items = { wywar: 1 }; return l; },

              { label: 'Weź znak i obiecaj', cost: 'obietnica',
                resolve: (c) => ({ text: `Znak jest zimniejszy, niż powinien być ołów. Przewoźnik nic nie mówi; umarli nie dziękują, bo im się to nie opłaca. Ale łódź niesie was dalej niż zwykle i przez chwilę bagno pachnie jak morze.`, effects: [{ item: 'znak_topielca', n: 1 }, { mark: 'obiecales_przewoznikowi' }] }) },
              { label: 'Odmów', cost: 'zły brzeg',
                resolve: (c) => ({ text: `— Nie noszę cudzych długów — mówisz, i to jest bardzo odmęckie zdanie.\n\nPrzewoźnik chowa znak. Woda pod łodzią robi się ciężka, jakby coś słuchało. Odpływa bez słowa, a wy zostajecie na złym brzegu.`, effects: [{ favor: { utopiona: -1 } }, { hp: -2, who: 'all' }] }) },
            ] },
          sad: {
            when: (c) => c.mark('oszukales_przewoznika') || c.mark('sprzedales_znak'),
            text: (c) => c.mark('sprzedales_znak')
              ? `Łódź czeka na was, jakby wiedziała, którędy pójdziecie. Przewoźnik nie wstaje.\n\n— Znak chłopca — mówi — poszedł na wagę. Ktoś spod znaku Wagi obiecał kaplicę, a sprzedał ołów. Nie ty. Ale to samo miasto.\n\nPodnosi rękę i woda wokół łodzi staje. Dosłownie. — Pani nie nosi urazy. Pani nosi rachunki.`
              : `Łódź czeka na was, jakby wiedziała, którędy pójdziecie. Przewoźnik nie wstaje.\n\n— Ktoś spod znaku Wagi — mówi — zapłacił mi kamykami. Nie ty. Ale kamyki mają ten sam herb, co ty.\n\nPodnosi rękę i woda wokół łodzi staje. Dosłownie. — Pani nie nosi urazy. Pani nosi rachunki.`,
            choices: [
              { label: 'Zapłać z nawiązką', cost: '10 monet', when: (c) => c.gold >= 10,
                resolve: (c) => ({ text: `Waży monety. Kiwa głową.\n\n— Rachunek domknięty. Miasto niech wie, że u mnie się nie kredytuje.\n\nŁódź rusza i po raz pierwszy słyszysz, że woda się o nic nie prosi.`, effects: [{ gold: -10 }, { unmark: 'oszukales_przewoznika' }, { unmark: 'sprzedales_znak' }, { favor: { utopiona: 1 } }] }) },
              { label: 'Zapłać krwią za cudzy dług', cost: '8 zdrowia',
                resolve: (c) => ({ text: `Krew jest cenniejsza od monet, bo nie da się jej odzyskać. Pani przyjmuje ją bez ceremonii. Przewoźnik wyciera nóż o rękaw.\n\n— Nie twój dług — mówi prawie łagodnie. — Ale twoja krew. Tak to działa w mieście, w którym mieszkasz.`, effects: [{ hp: -8 }, { unmark: 'oszukales_przewoznika' }, { unmark: 'sprzedales_znak' }] }) },
              { label: 'Odmów', cost: 'woda wstaje',
                resolve: (c) => ({ text: `— W takim razie — mówi Przewoźnik i po prostu odpływa.\n\nWoda, która stała, rusza się. Ktoś się z niej podnosi. Kilku.`, effects: [{ combat: { enemies: ['topielec', 'topielec'], ambush: true } }] }) },
            ] },
        } },
      /* ---- Ida Smolna: dezerterka, przyszła towarzyszka ---- */
      { id: 'ida', name: 'Dezerterka', emblem: 'net', habitat: ['droga', 'sucho', 'trzciny'],
        weight: (c) => (c.unlocked('ida') || c.companionDead('ida')) ? 0 : 1.4,
        cells: {
          prosba: {
            when: (c) => !c.mark('okradles_ide'),
            text: (c) => `Siedzi na pniu, z nogą owiniętą szmatą w kolorze, którego szmaty nie powinny mieć. Na ramieniu ma jeszcze naszywkę straży bagiennej Cechu, oderwaną do połowy — tyle, żeby nie kłamać, ale i nie przyznawać się.\n\n— Trzy dni — mówi, patrząc na wasze sakwy, nie na was. — Trzy dni temu poszłam za sierżantem na Pole Palików, bo tak kazał. Wróciłam sama. Cech to nazywa dezercją. Ja nazywam to arytmetyką.\n\nMa nóż, ale trzyma go tak, żebyście widzieli, że nie zamierza.`,
            choices: [
              { label: 'Daj jej wywar', cost: '1 wywar', when: (c) => c.has('wywar'),
                resolve: (c) => ({ text: `Pije, jakby wywar był czymś, co się pamięta z dzieciństwa. Kolor wraca jej do twarzy w dwóch ratach.\n\n— Ida — mówi. — Smolna. W Odmęcie znajdziesz mnie w Tawernie pod Wagą, o ile mnie wcześniej nie powieszą. Znam bagno. Znam warty. Umiem rzucić sieć tak, że topielec zapomina, po co wstał.\n\nTo brzmi jak oferta. Na Bagnach Dłużników wszystko brzmi jak oferta.`, effects: [{ item: 'wywar', n: -1 }, { unlock: 'ida' }] }) },
              { label: 'Zapłać jej za drogę', cost: '6 monet', when: (c) => c.gold >= 6,
                resolve: (c) => ({ text: `Bierze monety i przelicza, bo nawyk to nawyk. Potem rysuje patykiem na błocie: grobla, ścieżka przez trzciny, miejsce, gdzie nie wolno stawać po zmroku.\n\n— Jak wrócisz, szukaj mnie w Tawernie pod Wagą. Będę tą, która nie pije, bo nie ma za co.`, effects: [{ gold: -6 }, { unlock: 'ida' }, { know: 'sciezki_strazy' }, { reveal: 'all' }] }) },
              { label: 'Zostaw ją', cost: 'nic, teraz',
                resolve: (c) => ({ text: `Nie protestuje. Ludzie, którzy trzy dni siedzą na pniu, nie mają już ochoty na protesty.\n\n— Powiedz w Cechu, że mnie nie ${c.g('widziałeś', 'widziałaś')} — mówi. — Będzie prawdą, jak wystarczająco długo poczekasz.\n\nOdchodzicie. Przez chwilę słyszysz, jak ostrzy nóż. Potem tylko bagno.`, effects: [{ mark: 'zostawiles_ide' }] }) },
              { label: 'Zabierz jej nóż i sakwę', cost: 'sumienie, na kredyt',
                resolve: (c) => ({ text: `Broni się krócej, niż byś ${c.g('chciał', 'chciała')}. Nóż jest dobry, sakwa chuda: cztery monety i suchar.\n\n— Cech by cię polubił — mówi, kiedy odchodzicie. Nie krzyczy. To gorsze.`, effects: [{ gold: 4 }, { mark: 'okradles_ide' }] }) },
            ] },
          sad: {
            when: (c) => !!c.mark('okradles_ide'),
            text: (c) => `Nie widzisz jej. Słyszysz gwizd — krótki, jak sygnał warty. Potem drugi, z innej strony. Straż bagienna uczy, jak zwoływać ludzi. Ida nauczyła się, jak zwoływać coś innego.\n\n— Cztery monety i suchar — niesie się nad trzcinami. — Cech by się śmiał. Ja się nie śmieję.\n\nWoda wstaje.`,
            choices: [
              { label: 'Rzuć jej wszystko, co masz', cost: (c) => `${c.gold} monet`, when: (c) => c.gold >= 8,
                resolve: (c) => ({ text: `Sakiewka ląduje w błocie. Gwizd urywa się. Woda się kładzie.\n\n— Rachunek — mówi z ciemności. — Więcej cię nie znam.`, effects: [{ gold: -c.gold }, { unmark: 'okradles_ide' }] }) },
              { label: 'Do broni', cost: 'walka z zasadzki',
                resolve: (c) => ({ text: `Nie ma z kim rozmawiać. Jest tylko woda i to, co z niej wychodzi na gwizd.`, effects: [{ combat: { enemies: c.night ? ['topielec', 'ognik'] : ['topielec', 'topielec'], ambush: true } }] }) },
            ] },
        } },
      /* ---- Kaznodzieja z Grobli: heretyk, który ma rację ---- */
      { id: 'kaznodzieja', name: 'Kaznodzieja z Grobli', emblem: 'preacher', habitat: ['droga', 'święte', 'woda'],
        weight: (c) => c.mark('ochrzczony') ? 0.2 : (c.wounded ? 1.6 : 1),
        cells: {
          pokusa: {
            when: (c) => !c.mark('ochrzczony'),
            text: (c) => `Stoi po kolana w wodzie i mówi do niej, jakby woda była tłumem. W pewnym sensie jest.\n\n— Cech waży — woła, nie odwracając się. — Rachmistrz liczy. A Pani? Pani tylko bierze, co tonie, i nigdy nie pyta o odsetki. Jedyny uczciwy wierzyciel w tym kraju!\n\nOdwraca się. Ma oczy człowieka, który wypłakał wszystko i teraz ma sucho. — ${c.wounded ? 'Jesteś ' + c.g('ranny', 'ranna') + '. Widzę.' : 'Jeszcze cały. Jeszcze.'} Woda to weźmie. Wejdź. Nie zabiera nic, czego byś nie ${c.g('oddał', 'oddała')} i tak.`,
            choices: [
              { label: 'Wejdź do wody', cost: 'księga Pani',
                resolve: (c) => ({ text: `Woda jest ciepła, co jest najgorszą rzeczą, jaką mogła być. Rany zamykają się jak usta. Coś dotyka twojej kostki i puszcza — grzecznie, prawie z szacunkiem.\n\nKiedy wychodzisz, Kaznodzieja nie gratuluje. — Teraz jesteś w jej księdze — mówi. — Cech ma nosa do cudzych ksiąg.`, effects: [{ heal: 'full', who: 'all' }, { mark: 'ochrzczony' }, { favor: { utopiona: 2 } }, { favor: { rachmistrz: -1 } }] }) },
              { label: 'Odmów, ale rzuć monetę Pani', cost: '1 moneta', when: (c) => c.gold >= 1,
                resolve: (c) => ({ text: `Moneta tonie bez plusku. Kaznodzieja unosi brwi jak ktoś, kto widzi kompromis i szanuje go mniej niż grzech.\n\n— Skąpo — mówi. — Ale zapisane.`, effects: [{ gold: -1 }, { favor: { utopiona: 1 } }] }) },
              { label: 'Nazwij go heretykiem i idź', cost: 'niełaska Pani',
                resolve: (c) => ({ text: `— Heretyk — powtarza z zadowoleniem, jakbyś ${c.g('nadał', 'nadała')} mu tytuł. — Zapisz to w Cechu. Niech Rachmistrz ma rubrykę.\n\nIdziecie dalej. Woda za wami przez dłuższą chwilę się nie uspokaja.`, effects: [{ favor: { rachmistrz: 1 } }, { favor: { utopiona: -1 } }] }) },
            ] },
          targ: {
            when: (c) => !c.know('slowa_dla_utopionych'),
            text: (c) => `— Nie wiesz, jak się z nimi mówi — stwierdza Kaznodzieja, patrząc na twoje ręce, jakby to one miały rozmawiać. — Wszyscy z Odmętu przychodzicie tu z ogniem i solą, a nikt nie przychodzi ze słowami.\n\n— Utopieni są dłużnikami. Dłużnik chce jednej rzeczy: żeby ktoś powiedział, że rachunek jest zamknięty.\n\nWyciąga rękę. Nawet heretycy jedzą.`,
            choices: [
              { label: 'Zapłać za słowa', cost: '7 monet', when: (c) => c.gold >= 7,
                resolve: (c) => ({ text: `Uczy cię trzech zdań. Są krótkie, urzędowe, brzmią jak formuła z księgi Cechu — bo nią są.\n\n— Utopieni nie chcą modlitwy — mówi. — Chcą pokwitowania.`, effects: [{ gold: -7 }, { know: 'slowa_dla_utopionych' }] }) },
              { label: 'Odmów', cost: 'czas na sprzeczkę',
                resolve: (c) => ({ text: `— Sól i ogień — wzdycha. — Jak wszyscy.\n\nKłócicie się jeszcze chwilę, bo Kaznodzieja lubi się kłócić, a ty nie lubisz przegrywać. Słońce tymczasem robi swoje.`, effects: [{ time: 1 }] }) },
            ] },
        } },
      /* ---- Poborca Cechu: sucha władza na mokrej grobli ---- */
      { id: 'poborca', name: 'Poborca Cechu', emblem: 'scales', habitat: ['droga'], deathCause: (c) => 'zatłukły kije Cechu',
        weight: (c) => (c.mark('dlug') ? 1.2 : 0) + (c.depth <= 3 ? 1 : 0.4) + (c.gold >= 10 ? 0.6 : 0),
        cells: {
          myto: {
            when: (c) => !c.mark('dlug'),

                resolve: (c) => ({ text: `Odlicza, waży, zapisuje. Otrzymujesz kwit — kawałek cyny z odciśniętą wagą. W Odmęcie kwit jest wart więcej niż to, co za niego ${c.g('dałeś', 'dałaś')}: znaczy, że istniejesz.`, effects: [{ gold: -Math.max(1, Math.ceil(c.gold / 5)) }, { rep: { cech_wagi: 1 } }] }) },
              { label: 'Pokaż glejt Cechu', cost: 'nic — jesteś Klientem', when: (c) => c.tier('cech_wagi') >= GUILDS.cech_wagi.charterTier,
                resolve: (c) => ({ text: `Patrzy na glejt, potem na ciebie, i przez sekundę widzisz w jego oczach coś, co w Cechu uchodzi za szacunek: rachunek, który się zgadza.\n\n— Przejście — mówi. — Cech pozdrawia.`, effects: [{ favor: { rachmistrz: 1 } }] }) },
              { label: 'Skłam, że nic nie masz', cost: 'pióro Poborcy', when: (c) => c.gold >= 3,
                resolve: (c) => c.rng.chance(0.55)
                  ? { text: `Kiwa głową, zapisuje zero. Nie wierzy ci; po prostu nie opłaca mu się szukać. Gdy odchodzicie, słyszysz jego pióro.\n\nCech nie wierzy i nie zapomina — tylko czeka, aż dług sam się zbierze.`, effects: [{ mark: 'oklamales_poborce' }] }
                  : { text: `— Sakwa — mówi. Jeden z jego ludzi ją otwiera. Liczy powoli, żeby ci nie umknęła żadna sekunda. Zabierają połowę.\n\n— Za kłamstwo — wyjaśnia, jak nauczyciel.`, effects: [{ gold: -Math.ceil(c.gold / 2) }, { rep: { cech_wagi: -1 } }] } },
              { label: 'Odmów', cost: 'wpis w księdze',
                resolve: (c) => ({ text: `— Odmowa — powtarza i zapisuje to słowo tak starannie, jakby było twoim nazwiskiem. W pewnym sensie jest.\n\nNie zatrzymują was. Cech nie zatrzymuje. Cech dopisuje.`, effects: [{ rep: { cech_wagi: -1 } }, { mark: 'dlug' }] }) },
            ] },
          sad: {
            when: (c) => !!c.mark('dlug'),
            text: (c) => `Ten sam Poborca, ta sama cynowa waga, ale tym razem stoi na środku grobli, a jego ludzie po bokach — układ, w którym nie ma miejsca na „może".\n\n— Dług — mówi i pokazuje ci twoje własne nazwisko w księdze. Nie pamiętasz, żebyś je ${c.g('podawał', 'podawała')}. Cech nie potrzebuje, żeby mu podawać.`,
            choices: [
              { label: 'Spłać', cost: '12 monet', when: (c) => c.gold >= 12,
                resolve: (c) => ({ text: `Waży. Zgadza się. Skreśla.\n\nUczucie, które ci zostaje, przypomina ulgę, ale nią nie jest; to tylko cisza po skreśleniu.`, effects: [{ gold: -12 }, { unmark: 'dlug' }, { rep: { cech_wagi: 1 } }] }) },
              { label: 'Oddaj przedmiot', cost: (c) => `1 × ${ITEMS[c.firstItem()].name.toLowerCase()}`, when: (c) => !!c.firstItem(),
                resolve: (c) => ({ text: `Bierze, ogląda, wpisuje wartość, która jest mniejsza, niż myślisz, i większa, niż by ci przyznał.\n\n— Wystarczy — mówi. Dług nie znika z twarzy Poborcy. Znika tylko z księgi, a to w Odmęcie ważniejsze.`, effects: [{ item: c.firstItem(), n: -1 }, { unmark: 'dlug' }] }) },
              { label: 'Odmów', cost: 'kije Cechu',
                resolve: (c) => ({ text: `Nie biją długo. Cech nie płaci im za entuzjazm, tylko za dokładność.\n\nZostawiają cię w błocie z nazwiskiem w księdze i jednym słowem dopisanym obok. Nie widzisz jakim.`, effects: [{ hp: -6 }, { rep: { cech_wagi: -2 } }] }) },
            ] },
        } },
      /* ---- Utopieni: miejsce, które ma wolę ---- */
      { id: 'utopieni', name: 'Utopiony dłużnik', emblem: 'token', habitat: ['woda', 'umarli'],
        weight: (c) => (c.night ? 1.6 : 1) * (c.depth >= 3 ? 1.4 : 0.8),

            choices: [
              { label: 'Weź sakiewkę', cost: 'spokój wody',
                resolve: (c) => { const g = c.rng.int(6, 10); return { text: `Sakiewka puszcza z mokrym trzaskiem. ${g} monet, ciężkich, jakby nasiąkły.\n\nWoda pozostaje spokojna. To nie jest dobra wiadomość; to jest cierpliwość.`, effects: [{ gold: g }, { mark: 'obrabowales_topielca' }, { favor: { utopiona: -2 } }] }; } },
              { label: 'Rzuć mu monetę', cost: '1 moneta', when: (c) => c.gold >= 1,

              { label: 'Powiedz słowa', cost: 'trzy zdania', when: (c) => c.know('slowa_dla_utopionych'),
                resolve: (c) => ({ text: `Trzy zdania. Krótkie, urzędowe. Kiedy kończysz, ciało obraca się na plecy, powoli, jak ktoś, kto się budzi. Nie ma twarzy. Ma sakiewkę, którą podsuwa ci ręką.\n\nRachunek zamknięty. Kto by pomyślał, że tak niewiele im trzeba.`, effects: [{ gold: 8 }, { favor: { utopiona: 2 } }] }) },
              { label: 'Odejdź', cost: 'woda za plecami',
                resolve: (c) => ({ text: `Odchodzicie, nie odwracając się. Nie trzeba się odwracać, żeby wiedzieć, że woda za wami przestała być spokojna.`, effects: [{ mark: 'minales_topielca' }] }) },
            ] },
          skarbiec: {
            text: (c) => `Na ołtarzu ktoś — wielu ktosiów — odkładał przez dziesięciolecia to, co Cech kazał oddać, a Pani nie chciała: pierścienie, kwity, jedną koronę z cyny. Skarb dłużników.\n\nNikt go nie pilnuje. To znaczy: nikt, kogo widać.${c.mark('ograbiles_kaplice') ? '\n\nWoda w nawie stoi wyżej niż ostatnio. Ktoś już tu był spod znaku Wagi. Ktoś jak ty.' : ''}`,
            choices: [
              { label: 'Zabierz wszystko', cost: 'kaplica zapamięta',
                resolve: (c) => ({ text: `Bierzesz. Woda w kaplicy podnosi się o palec, potem o dwa. Na drugim brzegu ktoś się śmieje — Przewoźnik albo ktoś, kto się od niego nauczył.\n\nDo miasta wracasz ${c.g('bogaty', 'bogata')} i bardzo, bardzo ${c.g('obserwowany', 'obserwowana')}.`, effects: [{ gold: 25 }, { favor: { utopiona: -3 } }, { mark: 'ograbiles_kaplice' }] }) },
              { label: 'Weź tyle, ile zważysz jedną ręką', cost: 'reszta zostaje',
                resolve: (c) => ({ text: `Cech uczy: bierz tyle, ile udźwigniesz na wadze. Bierzesz tyle. Woda nie drgnie.\n\nGdzieś pod ołtarzem coś odlicza i wychodzi mu na zero.`, effects: [{ gold: 12 }] }) },
              { label: 'Zostaw ofiarę, weź kwity', cost: '3 monety', when: (c) => c.gold >= 3 && !c.know('kwity_kaplicy'),

            ] },
        } },

    rest: {
      state: (c) => {

        if (c.hero.mp < c.hero.maxMp / 3) L.push(`W głowie masz popiół tam, gdzie rano był ogień.`);
        if (c.companion) L.push(`${c.companion.short} rozstawia warty, zanim ktokolwiek zdąży zapytać. Straż bagienna uczy tego pierwszego dnia, żeby drugiego było komu uczyć dalej.`);

      },

      watch: (c) => `Czuwacie na zmianę. Sen na raty leczy na raty, ale nikt nie wstał z wody, żeby sprawdzić, kto śpi.`,

/* ============================================================
   1. NARZĘDZIA
   ============================================================ */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pl = (n, forms) => { const a = Math.abs(n); if (a === 1) return forms[0]; const m10 = a % 10, m100 = a % 100; return (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? forms[1] : forms[2]; };
const sign = (n) => (n > 0 ? '+' : '−') + Math.abs(n);
const paras = (t) => String(t).split(/\n\n+/).map((p, i) => `<p class="${i === 0 ? 'cap' : ''}">${esc(p).replace(/\n/g, '<br>')}</p>`).join('');

/* generator losowy z ziarnem: stan zapisywany, więc odświeżenie strony niczego nie przelosowuje */
function makeRng(seed) {
  const r = { state: seed >>> 0 };
  r.next = () => { let t = (r.state = (r.state + 0x6D2B79F5) >>> 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  r.chance = (p) => r.next() < p;
  r.pick = (arr) => arr[Math.floor(r.next() * arr.length)];
  r.weighted = (items, wfn) => { const ws = items.map(wfn); const tot = ws.reduce((a, b) => a + Math.max(0, b), 0); if (tot <= 0) return null; let x = r.next() * tot; for (let i = 0; i < items.length; i++) { x -= Math.max(0, ws[i]); if (x < 0) return items[i]; } return items[items.length - 1]; };
  return r;
}
const RNG = makeRng((Date.now() ^ (Math.random() * 1e9)) >>> 0);

/* imiona z sylab: reguła, nie lista */
const NAMEGEN = {
  onsets: ['b', 'd', 'g', 'h', 'j', 'k', 'l', 'm', 'n', 'r', 's', 't', 'w', 'z', 'br', 'dr', 'gr', 'kr', 'sk', 'st', 'tr', 'wr', 'sw'],
  nuclei: ['a', 'e', 'i', 'o', 'u', 'y', 'a', 'e', 'o'],
  codas: ['', '', 'n', 'r', 'l', 's', 't', 'k', 'm', 'w', 'sz', 'rn', 'lt', 'st', 'rd', 'nt'],
};
function genName(rng) {
  const f = rng.chance(0.5);
  const syl = () => rng.pick(NAMEGEN.onsets) + rng.pick(NAMEGEN.nuclei);
  let n = syl();
  if (rng.chance(0.55)) n += syl();
  n = f ? n.replace(/[aeiouy]$/, '') + 'a' : n + rng.pick(NAMEGEN.codas.filter(Boolean));
  if (n.length < 4) n += f ? 'na' : 'ek';
  return { name: n[0].toUpperCase() + n.slice(1) + ' ' + rng.pick(CFG.city.districts), f };
}

/* ============================================================
   2. STAN — jedna struktura, zapisywana w całości

let S = null;

}

function newHero(archId, name, f) {

}

function save() {

}

/* ---------- pomocnicy stanu ---------- */
const phaseOf = (step) => CFG.phases[Math.floor(step / CFG.stepsPerPhase) % CFG.phases.length];
const dayOf = (step) => Math.floor(step / (CFG.stepsPerPhase * CFG.phases.length)) + 1;
function tierIndex(city, gid) { const t = GUILDS[gid].tiers; let i = 0; for (let k = 0; k < t.length; k++) if (city.rep[gid] >= t[k].min) i = k; return i; }
function tierName(city, gid) { return GUILDS[gid].tiers[tierIndex(city, gid)].name; }
function nextTier(city, gid) { const t = GUILDS[gid].tiers, i = tierIndex(city, gid); return i + 1 < t.length ? t[i + 1] : null; }
function findPlace(region, id) { return region.places.find((p) => p.id === id); }

/* kontekst reguł: wszystko, o co pytają wagi, warunki i teksty */
function makeCtx(S, extra = {}) {
  const hero = S.hero, city = S.city, exp = S.exp;
  const region = extra.region || (exp ? REGIONS[exp.regionId] : null);
  const phase = exp ? phaseOf(exp.step) : CFG.phases[1];
  const place = extra.place || (exp && exp.encounter && region ? findPlace(region, exp.encounter.placeId) : null);
  const party = exp ? exp.party : [hero];
  const b = CFG.balance;
  return {
    S, hero, city, exp, region, phase, night: phase.night, place, party, rng: RNG,
    depth: exp ? exp.depth : 0,
    gold: hero ? hero.gold : 0, hp: hero ? hero.hp : 0, maxHp: hero ? hero.maxHp : 1,
    wounded: hero ? hero.hp < hero.maxHp * b.woundedBelow : false,
    healthy: hero ? hero.hp >= hero.maxHp * b.healthyAbove : true,
    poor: hero ? hero.gold < b.poorBelow : true, rich: hero ? hero.gold >= b.richAbove : false,
    has: (id) => (hero && hero.items[id]) || 0,
    know: (id) => city.knowledge.includes(id),
    mark: (id) => ((hero && hero.marks[id]) || 0) + (city.marks[id] || 0),
    favor: (id) => city.favor[id] || 0,
    rep: (id) => city.rep[id] || 0,
    tier: (id) => tierIndex(city, id),
    unlocked: (id) => !!(city.companions[id] && city.companions[id].alive),
    companionDead: (id) => !!(city.companions[id] && !city.companions[id].alive),
    companion: party.find((u) => u.id !== 'hero' && u.hp > 0) || null,
    g: (m, f) => (hero && hero.f ? f : m),
    name: hero ? hero.short : '',
    firstItem: () => (hero ? Object.keys(hero.items).find((id) => hero.items[id] > 0 && !ITEMS[id].quest) : null) || null,
    cityMarks: () => Object.keys(city.marks).filter((id) => city.marks[id] > 0),
  };
}

/* ---------- efekty: dane, które silnik stosuje i streszcza ---------- */
function applyEffects(S, effects, opts = {}) {
  const fx = []; const hero = S.hero, city = S.city, exp = S.exp;
  const units = (who) => (who === 'all' ? partyAlive(S) : [hero]);
  for (const e of effects || []) {
    if (e.gold != null) { const n = e.gold < 0 ? -Math.min(hero.gold, -e.gold) : e.gold; hero.gold += n; if (n) fx.push(`${sign(n)} ${pl(n, ['moneta', 'monety', 'monet'])}`); }
    if (e.hp != null) { for (const u of units(e.who)) { u.hp = clamp(u.hp + e.hp, 0, u.maxHp); } fx.push(`${sign(e.hp)} zdrowia${e.who === 'all' ? ' (wszyscy)' : ''}`); if (e.hp < 0) checkDeaths(S, opts.cause || 'zabrały Bagna'); }
    if (e.heal != null) { for (const u of units(e.who)) { const n = e.heal === 'full' ? u.maxHp : e.heal === 'third' ? Math.ceil(u.maxHp / 3) : e.heal; u.hp = clamp(u.hp + n, 0, u.maxHp); } fx.push(e.heal === 'full' ? 'rany zamknięte' : `+${e.heal === 'third' ? 'trzecia część' : e.heal} zdrowia${e.who === 'all' ? ' (wszyscy)' : ''}`); }
    if (e.mp != null) { hero.mp = clamp(hero.mp + e.mp, 0, hero.maxMp); fx.push(`${sign(e.mp)} woli`); }
    if (e.mana === 'full') { for (const u of partyAlive(S)) u.mp = u.maxMp; fx.push('wola odzyskana'); }
    if (e.item) { const n = e.n || 1; hero.items[e.item] = Math.max(0, (hero.items[e.item] || 0) + n); if (!hero.items[e.item]) delete hero.items[e.item]; fx.push(`${sign(n)} ${ITEMS[e.item].name.toLowerCase()}`); }
    if (e.mark) { const m = MARKS[e.mark]; const store = m.scope === 'city' ? city.marks : hero.marks; store[e.mark] = (store[e.mark] || 0) + 1; fx.push(`znak: ${m.label}`); }
    if (e.unmark) { if (city.marks[e.unmark] || hero.marks[e.unmark]) { delete city.marks[e.unmark]; delete hero.marks[e.unmark]; fx.push('znak zmazany'); } }
    if (e.favor) for (const g in e.favor) { city.favor[g] = clamp((city.favor[g] || 0) + e.favor[g], -CFG.balance.favorCap, CFG.balance.favorCap); fx.push(`${GODS[g].name}: łaska ${sign(e.favor[g])}`); }
    if (e.rep) for (const g in e.rep) { city.rep[g] = Math.max(0, (city.rep[g] || 0) + e.rep[g]); fx.push(`${GUILDS[g].name}: ${sign(e.rep[g])}`); }
    if (e.know && !city.knowledge.includes(e.know)) { city.knowledge.push(e.know); fx.push(`wiedza: ${KNOWLEDGE[e.know].name}`); }
    if (e.unlock) { const c = COMPANIONS[e.unlock]; if (!city.companions[e.unlock]) { city.companions[e.unlock] = { alive: true }; fx.push(`${c.name} czeka w Odmęcie`); } }
    if (e.time && exp) { exp.step += e.time; fx.push(`mija czas: ${phaseOf(exp.step).label.toLowerCase()}`); }
    if (e.reveal && exp) { if (e.reveal === 'all') { exp.revealAll = true; fx.push('szlak odsłonięty'); } else { exp.revealBonus = (exp.revealBonus || 0) + (e.n || 1); fx.push('widzisz dalej'); } }
    if (e.treasury != null) { city.gold = Math.max(0, city.gold + e.treasury); fx.push(`skarbiec: ${sign(e.treasury)}`); }
    if (e.combat) { S.pendingCombat = e.combat; fx.push('walka'); }
  }

}
function checkDeaths(S, cause) {
  for (const u of (S.exp ? S.exp.party : [S.hero])) {
    if (u.hp > 0 || u.deadNoted) continue;
    u.deadNoted = true;
    if (u.id === 'hero') { S.pendingDeath = cause; }
    else { u.down = true; }
  }
}

/* ============================================================
   3. SILNIKI — mapa, spotkania, walka, bogowie, powrót, śmierć.
   Nie znają żadnych nazw z konfiguracji.
   ============================================================ */
const MAP = { W: 360, H: 560, padX: 46, padY: 50 };
function genMap(rng, length) {
  const nodes = [], edges = [], layers = [];
  const yAt = (d) => MAP.H - MAP.padY - d * ((MAP.H - 2 * MAP.padY) / length);
  const add = (d, kind, x) => { const n = { id: nodes.length, depth: d, kind, x, y: yAt(d) + (d === 0 || d === length ? 0 : rng.int(-9, 9)), visited: false, resolved: false }; nodes.push(n); layers[d].push(n); return n; };
  layers[0] = []; add(0, 'miasto', MAP.W / 2);
  const genKinds = Object.values(KINDS).filter((k) => k.gen && k.id !== 'cel');
  let sinceRest = 0;
  for (let d = 1; d < length; d++) {
    layers[d] = [];
    const k = rng.int(CFG.map.minPerLayer, CFG.map.maxPerLayer);
    let restHere = false;
    for (let i = 0; i < k; i++) {
      const x = MAP.padX + ((MAP.W - 2 * MAP.padX) * (i + 1)) / (k + 1) + rng.int(-16, 16);
      let kind;
      if (!restHere && sinceRest >= CFG.map.restWindow - 1 && i === k - 1) kind = 'odpoczynek';
      else kind = rng.weighted(genKinds, (kk) => (kk.id === 'odpoczynek' && (restHere || d === 1)) ? 0 : kk.weight(d)).id;
      if (kind === 'odpoczynek') restHere = true;
      add(d, kind, x);
    }
    sinceRest = restHere ? 0 : sinceRest + 1;
  }
  layers[length] = []; add(length, 'cel', MAP.W / 2 + rng.int(-28, 28));
  for (let d = 0; d < length; d++) {
    const A = layers[d].slice().sort((a, b) => a.x - b.x), B = layers[d + 1].slice().sort((a, b) => a.x - b.x);
    const has = (a, b) => edges.some((e) => e[0] === a.id && e[1] === b.id);
    for (const a of A) {
      const near = B.slice().sort((p, q) => Math.abs(p.x - a.x) - Math.abs(q.x - a.x));
      edges.push([a.id, near[0].id]);
      if (near[1] && rng.chance(CFG.map.extraEdgeChance) && !has(a, near[1])) edges.push([a.id, near[1].id]);
    }
    for (const b of B) if (!edges.some((e) => e[1] === b.id)) { const near = A.slice().sort((p, q) => Math.abs(p.x - b.x) - Math.abs(q.x - b.x)); edges.push([near[0].id, b.id]); }
  }
  return { nodes, edges, length, seed: rng.int(1, 1e9) };
}
function nodeKnown(S, n) { const exp = S.exp; if (n.visited || exp.revealAll || n.kind === 'miasto' || n.kind === 'cel') return true; const cur = exp.map.nodes[exp.cur]; return n.depth <= cur.depth + revealAhead(S) + (exp.revealBonus || 0); }
function nextNodes(S) { const exp = S.exp, cur = exp.map.nodes[exp.cur]; if (!cur.resolved) return []; return exp.map.edges.filter((e) => e[0] === cur.id).map((e) => exp.map.nodes[e[1]]); }

/* ---------- wyprawa ---------- */
function genContracts(city) {
  const tier = tierIndex(city, 'cech_wagi');
  const regions = Object.values(REGIONS).filter((r) => (r.requiresTier || 0) <= tier);
  const out = [];
  for (const r of regions) {
    const base = Math.min(CFG.contracts.maxLength, CFG.contracts.baseLength + Math.floor(tier / 2));
    const goal = findPlace(r, r.goal.place);
    out.push({ regionId: r.id, length: base, name: `Zwiad: ${r.name}`, desc: `${base} ${pl(base, ['przejście', 'przejścia', 'przejść'])} do celu: ${goal.name}. Cech płaci za to, co wróci.`, reward: { gold: base * CFG.contracts.goldPerLayer, rep: base * CFG.contracts.repPerLayer } });
    const long = Math.min(CFG.contracts.maxLength, base + CFG.contracts.longExtra);
    out.push({ regionId: r.id, length: long, name: `Kontrakt: ${goal.name}`, desc: `${long} ${pl(long, ['przejście', 'przejścia', 'przejść'])}. Dłuższy szlak, głębsze bagno, lepsza zapłata — i więcej okazji, żeby nie wrócić.`, reward: { gold: Math.floor(long * CFG.contracts.goldPerLayer * 1.5), rep: Math.floor(long * CFG.contracts.repPerLayer * 1.5) } });
  }
  return out;
}
function startExpedition(S, contract, companionIds) {
  const hero = S.hero, city = S.city;
  const adv = city.upgrades.reduce((a, id) => Math.max(a, UPGRADES[id].advance || 0), CFG.advance.gold);
  hero.gold += adv;
  const kit = Object.assign({}, ARCHETYPES[hero.archId].kit);
  for (const id of city.upgrades) for (const k in (UPGRADES[id].kit || {})) kit[k] = (kit[k] || 0) + UPGRADES[id].kit[k];
  for (const k in kit) hero.items[k] = (hero.items[k] || 0) + kit[k];
  hero.status = {}; hero.deadNoted = false; hero.hp = hero.maxHp; hero.mp = hero.maxMp;
  const party = [hero, ...companionIds.filter((id) => city.companions[id] && city.companions[id].alive).slice(0, CFG.party.maxCompanions).map((id) => companionUnit(id, city))];
  city.expeditions++;
  S.exp = { regionId: contract.regionId, contract, map: genMap(RNG, contract.length), cur: 0, depth: 0, step: 0, party, advance: adv, encounter: null, seenCells: [], lastPlace: null, lastActor: null, prayed: {}, revealAll: false, revealBonus: 0, goalReached: false };
  S.exp.map.nodes[0].visited = true; S.exp.map.nodes[0].resolved = true;
  S.screen = 'map'; save();
}
function enterNode(S, id) {
  const exp = S.exp, node = exp.map.nodes[id];
  if (!nextNodes(S).some((n) => n.id === id)) return;
  exp.cur = id; exp.depth = node.depth; exp.step++; node.visited = true;
  exp.encounter = KINDS[node.kind].gen(S, node);
  S.screen = 'encounter'; save();
}
function resolveNode(S) {
  const exp = S.exp, node = exp.map.nodes[exp.cur];
  node.resolved = true; if (node.kind === 'cel') exp.goalReached = true;
  exp.encounter = null; S.screen = 'map'; save();
}

/* ---------- spotkania: reguły wybierają miejsce × aktora × napięcie ---------- */
const mode = (arr) => arr.slice().sort((a, b) => arr.filter((v) => v === a).length - arr.filter((v) => v === b).length).pop();
function pickPlace(S, region, filter) {
  const exp = S.exp;
  let c = region.places.filter((p) => !p.goal && filter(p));
  if (c.length > 1) c = c.filter((p) => p.id !== exp.lastPlace);
  if (!c.length) c = region.places.filter((p) => !p.goal);
  const p = RNG.pick(c); exp.lastPlace = p.id; return p;
}
function genChoice(S, node) {
  const region = REGIONS[S.exp.regionId];
  const ctx = makeCtx(S, { region, place: null });
  const cands = [];
  for (const actor of region.actors) {
    const aw = actor.weight ? actor.weight(ctx) : 1; if (aw <= 0) continue;
    for (const tid in actor.cells) {
      const cell = actor.cells[tid], T = TENSIONS[tid];
      if (cell.when && !cell.when(ctx)) continue;
      const aff = T.affinity(ctx); if (aff <= 0) continue;
      const key = actor.id + '/' + tid;
      let w = aw * aff * (cell.weight ? cell.weight(ctx) : 1);
      if (S.exp.seenCells.includes(key)) w *= 0.25;
      if (S.exp.lastActor === actor.id) w *= 0.3;
      cands.push({ actor, tid, cell, key, w });
    }
  }
  const pick = RNG.weighted(cands, (c) => c.w);
  if (!pick) return genRest(S, node);
  const place = pickPlace(S, region, (p) => p.tags.some((t) => pick.actor.habitat.includes(t)));
  S.exp.seenCells.push(pick.key); S.exp.lastActor = pick.actor.id;
  const c2 = makeCtx(S, { region, place });
  return { kind: 'wybor', placeId: place.id, actorId: pick.actor.id, tensionId: pick.tid, text: place.beat(c2) + '\n\n' + pick.cell.text(c2), stage: 'open', weather: region.weather(c2.phase, RNG) };
}
function genGoal(S, node) {
  const region = REGIONS[S.exp.regionId], g = region.goal;

  if (city.knowledge.includes('kwity_kaplicy') && !city.delivered.kwity_kaplicy) { city.delivered.kwity_kaplicy = true; const fx = applyEffects(S, [{ rep: { cech_wagi: 3 } }, { treasury: 6 }]); E.push({ title: 'Kwity', text: `Kładziesz kwity z kaplicy na stole. Nikt ich nie czyta. Ktoś je bardzo szybko chowa i bardzo szybko wpisuje ci reputację, a potem patrzy, czy ${ctx.g('zrozumiałeś', 'zrozumiałaś')}. ${ctx.g('Zrozumiałeś', 'Zrozumiałaś')}.`, fx }); }
  if (hero.items.znak_topielca) E.push({ title: 'Znak dłużnika', text: `Ołowiany znak chłopca. Kaplica przy Kanale przyjmuje takie rzeczy za darmo i modli się za nie. Cech przyjmuje takie rzeczy za sześć monet i przetapia na wagi.`, fx: [], choice: [
    { label: 'Oddaj kaplicy', cost: 'obietnica dotrzymana', effects: [{ item: 'znak_topielca', n: -1 }, { favor: { utopiona: 2 } }, { unmark: 'obiecales_przewoznikowi' }, { mark: 'znak_w_kaplicy' }], text: `Kapłanka bierze znak bez słowa i wiesza go między setką innych. Gdzieś na Bagnach woda robi się na chwilę lżejsza.` },
    { label: 'Sprzedaj Cechowi', cost: '+6 monet do skarbca', effects: [{ item: 'znak_topielca', n: -1 }, { treasury: 6 }, { mark: 'sprzedales_znak' }, { unmark: 'obiecales_przewoznikowi' }], text: `Ołów jest ołowiem. Sześć monet wpada do skarbca z dźwiękiem, który przez chwilę brzmi jak plusk.` },
  ] });
  const comps = exp.party.filter((u) => u.id !== 'hero'), alive = comps.filter((u) => u.hp > 0);
  if (comps.length) E.push({ title: 'Drużyna', text: alive.length ? `${alive.map((u) => u.short).join(' i ')} ${alive.length > 1 ? 'idą' : 'idzie'} do Tawerny pod Wagą, nie oglądając się. Jutro ${alive.length > 1 ? 'będą' : 'będzie'} tam znowu.` : `Wracasz ${ctx.g('sam', 'sama')}. W Tawernie ktoś zwolni miejsce przy stole i nikt o tym nie wspomni.`, fx: [] });

}
function reckChoice(S, k) { const e = S.reck.entries[S.reck.i]; if (!e.choice) return; const ch = e.choice[k]; const fx = applyEffects(S, ch.effects); e.text = ch.text; e.fx = fx; e.choice = null; save(); }

const FXQ = [], FX = { p: null };

  const seen = {};

    const f = FXQ.shift();
    if (f.t === 'float') { const el = document.querySelector(`[data-uid="${f.uid}"]`); if (!el) continue; const k = (seen[f.uid] = (seen[f.uid] || 0) + 1); const s = document.createElement('span'); s.className = 'float ' + (f.cls || ''); s.textContent = f.text; s.style.top = (k - 1) * 20 + 'px'; el.appendChild(s); setTimeout(() => s.remove(), 1000); }
    else if (f.t === 'shake') { const el = $('.scene') || $('#app'); if (!el) continue; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); if (FX.p) FX.p.burst(FX.p.w / 2, FX.p.h * 0.65, 14, '#e0a441'); }
    else if (f.t === 'flash') { const d = document.createElement('div'); d.className = 'flash ' + (f.kind || ''); document.body.appendChild(d); setTimeout(() => d.remove(), 450); }
  }
}
function paperTexture() {

function sceneHTML(S, o) {
